# Smithery configuration for Revisão de Contrato Bancário
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_revisao-bancaria

name: revisao-bancaria-mcp
displayName: "Revisão de Contrato Bancário"
description: >
  **Revisão de contrato bancário** para IA. Recalcule juros, correção e valores de contratos e financiamentos com índices e taxas oficiais do BACEN. Feito para ações revisionais, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/revisao-bancaria-mcp
repository: https://github.com/mcp-dir/revisao-bancaria-mcp

tags:
  - juridico
  - legal
  - revisao-bancaria
  - bancario
  - selic
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_revisao-bancaria

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_revisao-bancaria/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
